name: Sensor design sanity check

on:
  push:
    paths:
      - 'hardware/kicad/sensors_v1_connectivity.csv'
      - 'hardware/kicad/check_sensor_design.py'
      - '.github/workflows/sensor-design-check.yml'
  pull_request:
    paths:
      - 'hardware/kicad/sensors_v1_connectivity.csv'
      - 'hardware/kicad/check_sensor_design.py'

jobs:
  connectivity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sensor/I2C architecture invariants
        run: python hardware/kicad/check_sensor_design.py
