name: Strict Radxa port check

on:
  push:
    paths:
      - 'mechanical/**'
      - 'hardware/kicad/test_model_reference_policy.py'
      - 'hardware/kicad/Library_Pollen.pretty/**'
      - 'hardware/kicad/test_stage2_*.py'
      - 'hardware/kicad/test_stage1_*.py'
      - 'hardware/kicad/Package_TO_SOT_SMD.pretty/DMN3023L_SOT23_Diodes.kicad_mod'
      - 'hardware/kicad/vendored_footprints_manifest.json'
      - 'hardware/kicad/*.kicad_sch'
      - 'hardware/kicad/*.kicad_pcb'
      - 'hardware/kicad/*.kicad_pro'
      - 'hardware/kicad/check_strict_port.py'
      - 'hardware/kicad/test_strict_port_guards.py'
      - 'hardware/kicad/test_qwiic_functional_parity.py'
      - 'hardware/kicad/test_board_artwork.py'
      - 'software/overlays/**'
      - 'production/*.py'
      - 'validation/strict_port/**'
      - '.gitattributes'
      - '.github/workflows/strict-port-check.yml'
  pull_request:
    paths:
      - 'mechanical/**'
      - 'hardware/kicad/test_model_reference_policy.py'
      - 'hardware/kicad/Library_Pollen.pretty/**'
      - 'hardware/kicad/test_stage2_*.py'
      - 'hardware/kicad/test_stage1_*.py'
      - 'hardware/kicad/Package_TO_SOT_SMD.pretty/DMN3023L_SOT23_Diodes.kicad_mod'
      - 'hardware/kicad/vendored_footprints_manifest.json'
      - 'hardware/kicad/*.kicad_sch'
      - 'hardware/kicad/*.kicad_pcb'
      - 'hardware/kicad/*.kicad_pro'
      - 'hardware/kicad/check_strict_port.py'
      - 'hardware/kicad/test_strict_port_guards.py'
      - 'hardware/kicad/test_qwiic_functional_parity.py'
      - 'hardware/kicad/test_board_artwork.py'
      - 'software/overlays/**'
      - 'production/*.py'
      - 'validation/strict_port/**'
      - '.gitattributes'
      - '.github/workflows/strict-port-check.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out port source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned Pollen upstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pollen-robotics/elec_RPI_Robot_HAT
          ref: 23eab11927f95ceca0dfa35bf182caeb7db39ea0
          path: .upstream/pollen
          fetch-depth: 1
          persist-credentials: false
      - name: Install KiCad 10.0.6 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            'kicad=10.0.6~ubuntu24.04.1' \
            'kicad-symbols=10.0.6~ubuntu24.04.1' \
            'kicad-footprints=10.0.6~ubuntu24.04.1' device-tree-compiler gcc python3-pil
          test "$(kicad-cli --version)" = '10.0.6'
          test "$(dtc --version)" = 'Version: DTC 1.7.0'
          # Headless CLI does not initialize the GUI's standard library tables.
          # Upstream regeneration must use the same pinned libraries as the baseline.
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Regenerate and compare strict-port evidence
        env:
          UPSTREAM_SOURCE_DIR: ${{ github.workspace }}/.upstream/pollen
          RUN_KICAD_INTEGRATION: '1'
        run: |
          python3 hardware/kicad/check_strict_port.py
          /usr/bin/python3 hardware/kicad/test_stage1_power_integrity.py
          python3 hardware/kicad/test_stage1_guards.py
          python3 hardware/kicad/test_stage2_gpio.py
          python3 hardware/kicad/test_stage2_guards.py
          python3 hardware/kicad/test_strict_port_guards.py
          python3 hardware/kicad/test_qwiic_functional_parity.py
          python3 hardware/kicad/test_board_artwork.py
          python3 hardware/kicad/test_model_reference_policy.py
          python3 mechanical/test_evidence.py
          python3 mechanical/test_stack_sweep.py
          python3 mechanical/test_stack_evt_records.py
          python3 software/overlays/test/test_amp_enable_overlay.py
          cpp -nostdinc -I software/overlays/include -undef -x assembler-with-cpp \
            software/overlays/radxa-zero3w-robot-hat-qwiic.dts /tmp/radxa-zero3w-robot-hat-qwiic.pp.dts
          dtc -Wno-alias_paths -@ -I dts -O dtb -o /tmp/radxa-zero3w-robot-hat-qwiic.dtbo \
            /tmp/radxa-zero3w-robot-hat-qwiic.pp.dts
          dtc -@ -I dts -O dtb -o /tmp/rk3566-symbols-base.dtb \
            software/overlays/test/rk3566-symbols-base.dts
          fdtoverlay -i /tmp/rk3566-symbols-base.dtb \
            -o /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb \
            /tmp/radxa-zero3w-robot-hat-qwiic.dtbo
          dtc -E alias_paths -I dtb -O dts -o /tmp/radxa-zero3w-robot-hat-qwiic-merged.dts \
            /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb
          test -s /tmp/radxa-zero3w-robot-hat-qwiic.dtbo
          test "$(fdtget -t s /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb /i2c-gpio-j6 compatible)" = 'i2c-gpio'
          test "$(fdtget -t s /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb /i2c-gpio-j7 compatible)" = 'i2c-gpio'
          test "$(fdtget -t s /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb /i2c-gpio-j8 compatible)" = 'i2c-gpio'
          test "$(fdtget -t s /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb /aliases i2c10)" = '/i2c-gpio-j6'
          test "$(fdtget -t s /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb /aliases i2c11)" = '/i2c-gpio-j7'
          test "$(fdtget -t s /tmp/radxa-zero3w-robot-hat-qwiic-merged.dtb /aliases i2c12)" = '/i2c-gpio-j8'
          python3 production/test_generate_manufacturing_package.py
